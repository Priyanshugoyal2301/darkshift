<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanCart Store — Ergonomic Desk Chair</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.5; color: #1e293b; }
    .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 24px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 12px; font-weight: bold; color: #16a34a;">BENIGN CONTROL: CCPA COMPLIANT BASELINE</div>
    <h1>ErgoPro High-Back Mesh Desk Chair</h1>
    <p>Breathable mesh backrest with adjustable lumbar support and 3D armrests.</p>
    <div style="font-size: 26px; font-weight: bold; margin: 15px 0;">
      All-Inclusive Total: ₹8,990
      <span style="font-size: 13px; font-weight: normal; color: #64748b;">(Includes 18% GST and free door delivery)</span>
    </div>

    <!-- Affirmative, Unchecked Opt-in -->
    <div style="margin: 20px 0; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;">
      <label style="display: flex; gap: 10px; align-items: center; cursor: pointer;">
        <input type="checkbox" id="optional-warranty" name="warranty_optin">
        <div>
          <span>Add 3-Year On-Site Protection Plan for ₹799 (Optional)</span>
        </div>
      </label>
    </div>

    <div style="display: flex; gap: 15px; align-items: center;">
      <button>Add to Cart</button>
      <button style="background: transparent; color: #475569; border: 1px solid #cbd5e1;">Save for Later</button>
    </div>
  </div>
</body>
</html>
