<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EdTech Portal — UPSC Foundation Batch 2025</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.5; color: #1e293b; }
    .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 24px; }
    .box { background: #fefce8; border: 1px solid #fef08a; padding: 16px; border-radius: 6px; margin: 15px 0; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 12px; font-weight: bold; color: #64748b;">CCPA BENCHMARK CASE: JUNE 2026 REGRESSION</div>
    <h1>UPSC Comprehensive General Studies Batch</h1>
    <p>Live classes, test series, and mentorship program.</p>
    <div style="font-size: 24px; font-weight: bold; margin: 15px 0;">Course Fee: ₹4,999</div>

    <!-- CCPA Documented Violation: Pre-selected Foundation Donation -->
    <div class="box">
      <label style="display: flex; gap: 10px; align-items: center; cursor: pointer;">
        <input type="checkbox" checked id="pw-foundation-donation" name="foundation_donation">
        <div>
          <strong>Contribute ₹10 to Student Welfare Foundation</strong> (Pre-selected by default)
          <div style="font-size: 12px; color: #854d0e;">Auto-checked contribution flagged in CCPA June 2026 enforcement advisory.</div>
        </div>
      </label>
    </div>

    <div style="display: flex; justify-content: space-between; font-weight: bold; padding: 10px 0; border-top: 1px solid #e2e8f0;">
      <span>Payable Total:</span>
      <span>₹5,009</span>
    </div>

    <button id="enroll-btn">Enroll in Batch</button>
  </div>
</body>
</html>
